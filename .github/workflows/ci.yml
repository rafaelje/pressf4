name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate bundle metadata
        run: |
          plutil -lint Resources/Info.plist
          plutil -lint Resources/CapturaApp.entitlements
      - name: Run model tests
        run: make test
      - name: Build application
        run: make SIGN_IDENTITY=-
      - name: Verify application bundle
        run: |
          test -x build/pressf4.app/Contents/MacOS/pressf4
          test -f build/pressf4.app/Contents/Resources/AppIcon.icns
          codesign --verify --deep --strict --verbose=2 build/pressf4.app

  codeql:
    name: CodeQL (Swift)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Build application
        run: make SIGN_IDENTITY=-
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
