name: Build and publish DMG release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmg-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version
        id: release
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid CFBundleShortVersionString: $version" >&2
            exit 1
          fi

          tag="v${version}"
          commit="$HEAD_SHA"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=pressf4 $tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $tag already exists; no release assets will be replaced." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Preparing $tag from $commit." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-publish:
    name: Universal macOS DMG
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Configure Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          values=("$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PASSWORD")
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && ((configured += 1))
          done

          if (( configured != 0 && configured != 3 )); then
            echo "Apple signing secrets are only partially configured." >&2
            exit 1
          fi

          if (( configured == 0 )); then
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "The DMG will use an ad-hoc signature because Apple signing secrets are absent." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          keychain_path="$RUNNER_TEMP/pressf4-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/pressf4-certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

          identity=$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          if [[ -z "$identity" ]]; then
            echo "APPLE_CERTIFICATE does not contain a Developer ID Application identity." >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build universal DMG
        run: make dmg
      - name: Notarize DMG when credentials are configured
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          values=("$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID")
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && ((configured += 1))
          done

          if (( configured != 0 && configured != 3 )); then
            echo "Apple notarization secrets are only partially configured." >&2
            exit 1
          fi

          dmg="dist/pressf4_${RELEASE_VERSION}_universal.dmg"
          if (( configured == 0 )); then
            echo "Notarization was skipped because Apple notarization secrets are absent." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$SIGN_IDENTITY" == "-" ]]; then
            echo "Notarization requires a Developer ID Application signature." >&2
            exit 1
          fi

          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
      - name: Create checksum
        run: |
          set -euo pipefail
          if [[ ! -d dist ]]; then
            echo "No dist/ directory was produced." >&2
            exit 1
          fi
          cd dist
          shopt -s nullglob
          dmgs=(*.dmg)
          if (( ${#dmgs[@]} == 0 )); then
            echo "No DMG was produced in dist/." >&2
            exit 1
          fi
          shasum -a 256 "${dmgs[@]}" > SHA256SUMS.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: pressf4-${{ needs.prepare.outputs.version }}-macos-universal
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.title }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace immutable assets." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" dist/*.dmg dist/SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" \
            --title "$RELEASE_TITLE" \
            --generate-notes
